services:
  - type: web
    name: one99properties-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPABASE_DB_SSL
        value: true
      - key: CLIENT_URLS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
